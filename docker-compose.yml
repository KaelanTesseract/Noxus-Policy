services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/documents:/app/documents
      - ./backend/models:/app/models_data
    environment:
      - DATABASE_URL=sqlite:////app/data/versicherungsmanager.db
      - SECRET_KEY=changeme123
    networks:
      - app-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - app-net
    restart: always
    depends_on:
      - backend

networks:
  app-net:
    driver: bridge
