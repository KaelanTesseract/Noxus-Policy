name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Typecheck, Audit, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Known vulnerabilities in what ships (any severity)
        run: npm audit --omit=dev
      - name: Known vulnerabilities in build tooling (informational)
        # ESLint and the shadcn CLI are only used while developing and are not
        # part of the running app, so a finding there is reported but does not
        # block the build.
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build

  backend:
    name: Backend (Compile, Dependency audit, Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile
        run: python -m compileall -q backend/*.py backend/routers
      - name: Install audit tool
        run: pip install --quiet pip-audit
      - name: Audit the resolved dependency tree (incl. transitive packages)
        run: |
          # Audit the requirement list including its transitive packages.
          # (Auditing an installed venv instead would also flag the pip/setuptools
          # that ship with it - not part of the app - and fail on advisories we
          # can't act on.)
          pip-audit --strict -r backend/requirements.txt
          # Same dependency set, installed for the tests below.
          python -m venv .audit-venv
          .audit-venv/bin/pip install --quiet --upgrade pip
          .audit-venv/bin/pip install --quiet -r backend/requirements.txt
      - name: Security regression tests
        run: |
          .audit-venv/bin/pip install --quiet pytest
          cd backend && ../.audit-venv/bin/python -m pytest -q

  docker:
    name: Docker (Images bauen, Backend starten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        run: SECRET_KEY=ci-only-not-a-secret docker compose config --quiet
      - name: Build the backend image
        run: docker build -t zettelfrieden-backend backend
      - name: Build the frontend image
        run: docker build -t zettelfrieden-frontend frontend
      - name: Backend starts, answers and has its tools
        run: |
          docker run -d --name backend -p 8000:8000             -e SECRET_KEY=ci-only-0123456789abcdef0123456789abcdef             -e DATABASE_URL=sqlite:////app/data/ci.db             zettelfrieden-backend uvicorn main:app --host 0.0.0.0 --port 8000 --no-proxy-headers
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ | grep -q '"status":"ok"'; then echo "backend answers"; break; fi
            if [ "$i" = "30" ]; then docker logs backend; exit 1; fi
            sleep 2
          done
          docker exec backend tesseract --list-langs | grep -qx deu
          docker exec backend pdftotext -v
          docker exec backend sh -c 'grep ^Uid /proc/1/status'
