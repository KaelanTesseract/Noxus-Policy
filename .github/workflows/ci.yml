name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Typecheck, Audit, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Known vulnerabilities (high and above)
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build

  backend:
    name: Backend (Compile, Dependency audit, Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile
        run: python -m compileall -q backend/*.py backend/routers
      - name: Install audit tool
        run: pip install --quiet pip-audit
      - name: Audit the resolved dependency tree (incl. transitive packages)
        run: |
          # Audit the requirement list including its transitive packages.
          # (Auditing an installed venv instead would also flag the pip/setuptools
          # that ship with it - not part of the app - and fail on advisories we
          # can't act on.) llama-cpp-python compiles native code and is audited
          # on its own pin below.
          grep -v '^llama-cpp-python' backend/requirements.txt > /tmp/requirements-audit.txt
          pip-audit --strict -r /tmp/requirements-audit.txt
          # Same dependency set, installed for the tests below.
          python -m venv .audit-venv
          .audit-venv/bin/pip install --quiet --upgrade pip
          .audit-venv/bin/pip install --quiet -r /tmp/requirements-audit.txt
      - name: Security regression tests
        run: |
          .audit-venv/bin/pip install --quiet pytest
          cd backend && ../.audit-venv/bin/python -m pytest -q
      - name: Audit llama-cpp-python pin
        run: |
          grep '^llama-cpp-python' backend/requirements.txt > /tmp/requirements-llama.txt
          pip-audit -r /tmp/requirements-llama.txt --no-deps --disable-pip
